{% extends 'layout.html' %}
{% block content %}
<style>
    html, body {
        overflow: auto !important;
        height: auto !important;
    }
    .viber-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        width: 100%;
    }
    .viber-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 40px;
        padding: 40px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.1);
        max-width: 600px;
        width: 100%;
    }
    .premium-input-small {
        width: 110px;
        background: #f5f5f7;
        border: 2px solid transparent;
        border-radius: 15px;
        padding: 10px 15px;
        font-size: 1.1rem;
        font-weight: 800;
        color: #1d1d1f;
        text-align: center;
        outline: none;
        transition: all 0.3s;
    }
    .premium-input-small:focus {
        background: #fff;
        border-color: #007AFF;
        box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }
    .candidate-entry-row {
        background: white;
        border-radius: 20px;
        padding: 15px 25px;
        border: 1px solid rgba(0,0,0,0.03);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
</style>

<div class="viber-container">
    <div class="viber-card shadow-lg">
        <div class="text-center">
            <span class="fs-1">🗳️</span>
            <h2 class="fw-900 mt-2">Viber Popularity Poll</h2>
            <p class="text-muted small fw-bold text-uppercase mb-4">Manual Raw Votes Log</p>
        </div>

        <form method="POST">
            <div class="mb-4">
                {% for can in candidates %}
                <div class="candidate-entry-row shadow-sm">
                    <div>
                        <div class="fw-bold text-dark fs-6">{{ can.name }}</div>
                        <div class="small text-muted text-uppercase fw-semibold" style="font-size: 0.7rem;">{{ can.department }}</div>
                    </div>
                    <div>
                        <input type="number"
                               name="votes-{{ can.id }}"
                               class="premium-input-small"
                               min="0"
                               value="{{ existing_votes.get(can.id, 0) }}"
                               required>
                    </div>
                </div>
                {% endfor %}
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold">
                Save Viber Votes
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/hr-results/viber" class="text-muted text-decoration-none fw-bold small text-uppercase">
                <i class="fas fa-arrow-left me-1"></i> Return to Viber Tabulations
            </a>
        </div>
    </div>
</div>
{% endblock %}
